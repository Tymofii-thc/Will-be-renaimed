# oath admission webhook. Install with deploy/install.sh (it generates TLS certs and fills caBundle).
apiVersion: v1
kind: Namespace
metadata:
  name: oath-system
  labels:
    oath.io/exempt: "true"        # the webhook's own namespace is never checked (avoids a bootstrap deadlock)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oath-webhook
  namespace: oath-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: oath-webhook }
  template:
    metadata:
      labels: { app: oath-webhook }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: webhook
          image: __OATH_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - { name: OATH_SIGNER, value: "__OATH_SIGNER__" }      # comma-separated: list old + new key during rotation
            - { name: OATH_NETWORK, value: "__OATH_NETWORK__" }    # devnet | mainnet
            - { name: OATH_MODE, value: "enforce" }                # audit = allow but warn
            - { name: OATH_PIN, value: "true" }                    # rewrite tag -> verified digest
          ports: [{ containerPort: 8443 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8443, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: oath-webhook-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: oath-webhook
  namespace: oath-system
spec:
  selector: { app: oath-webhook }
  ports: [{ port: 443, targetPort: 8443 }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: oath
webhooks:
  - name: pods.oath.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 15
    failurePolicy: Fail                   # if the webhook is down, pods are NOT admitted (fail closed)
    reinvocationPolicy: Never
    namespaceSelector:
      matchExpressions:
        - { key: oath.io/exempt, operator: NotIn, values: ["true"] }
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: ["kube-system", "kube-public", "kube-node-lease"] }
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    clientConfig:
      service: { name: oath-webhook, namespace: oath-system, path: /validate }
      caBundle: __CA_BUNDLE__
