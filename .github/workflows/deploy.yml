name: build-anchor-verify-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:latest

      # Optional gate: set repo variable OATH_SCAN=true to refuse to anchor (and therefore deploy) images with fixable CRITICAL vulnerabilities.
      - name: Vulnerability scan (Trivy)
        if: vars.OATH_SCAN == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Dogfooding: this repo uses its own action.
      - name: Anchor digest on Solana
        uses: ./
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          secret-key: ${{ secrets.SOLANA_SECRET_KEY }}
          rpc: ${{ vars.SOLANA_RPC || 'https://api.devnet.solana.com' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image exactly as prod would
        run: docker pull "${IMAGE}:latest"

      # The gate: if the image in the registry is not one the pipeline anchored
      # (e.g. someone pushed to :latest by hand), this exits 1 and the deploy stops.
      - name: Verify image against Solana
        run: node bin/oath.mjs verify --signer "${{ vars.OATH_SIGNER }}" --image "${IMAGE}:latest" ${{ vars.SOLANA_RPC && format('--rpc {0}', vars.SOLANA_RPC) || '' }}

      - name: Deploy
        run: echo "Image verified. Replace this step with your real deploy (kubectl / ssh / compose)."
