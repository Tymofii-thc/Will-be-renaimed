name: build-anchor-verify-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:latest

      # Dogfooding: this repo uses its own action.
      - name: Anchor digest on Solana
        uses: ./
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          secret-key: ${{ secrets.SOLANA_SECRET_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image exactly as prod would
        run: docker pull "${IMAGE}:latest"

      # The gate: if the image in the registry is not one the pipeline anchored
      # (e.g. someone pushed to :latest by hand), this exits 1 and the deploy stops.
      - name: Verify image against Solana
        run: node bin/pod.mjs verify --signer "${{ vars.POD_SIGNER }}" --image "${IMAGE}:latest"

      - name: Deploy
        run: echo "Image verified. Replace this step with your real deploy (kubectl / ssh / compose)."
