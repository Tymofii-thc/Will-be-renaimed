name: build-anchor-verify-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write       # keyless Sigstore signing of the build attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:latest

      # SLSA build provenance: a Sigstore-signed statement (via GitHub OIDC, no long-lived key) that THIS workflow built THIS digest.
      # Verify: gh attestation verify oci://${IMAGE}@<digest> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Optional gate: set repo variable OATH_SCAN=true to refuse to anchor (and therefore deploy) images with fixable CRITICAL vulnerabilities.
      - name: Vulnerability scan (Trivy)
        if: vars.OATH_SCAN == 'true'
        run: |
          docker run --rm -e TRIVY_USERNAME="${{ github.actor }}" -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            aquasec/trivy:0.57.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      # Dogfooding: this repo uses its own action.
      - name: Anchor digest on Solana
        uses: ./
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          secret-key: ${{ secrets.SOLANA_SECRET_KEY }}
          rpc: ${{ vars.SOLANA_RPC || 'https://api.devnet.solana.com' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image exactly as prod would
        run: docker pull "${IMAGE}:latest"

      # The gate: if the image in the registry is not one the pipeline anchored
      # (e.g. someone pushed to :latest by hand), this exits 1 and the deploy stops.
      - name: Verify image against Solana
        run: node bin/oath.mjs verify --signer "${{ vars.OATH_SIGNER }}" --image "${IMAGE}:latest" ${{ vars.SOLANA_RPC && format('--rpc {0}', vars.SOLANA_RPC) || '' }}

      - name: Deploy
        run: echo "Image verified. Replace this step with your real deploy (kubectl / ssh / compose)."
